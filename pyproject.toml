[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexiguard"
version = "1.0.0"
description = "Multi-Contract Legal GraphRAG & Compliance Agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ronak"}]

dependencies = [
    # LLM & Agent Framework
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    # Graph Database
    "neo4j>=5.20.0",
    # PDF Parsing
    "pymupdf4llm>=0.0.10",
    "pymupdf>=1.24.0",
    # Structured Extraction
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "instructor>=1.3.0",
    "openai>=1.30.0",
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Evaluation
    "ragas>=0.2.0",
    "datasets>=2.19.0",
    # Data & Utils
    "huggingface-hub>=0.23.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "rich>=13.7.0",
    "chromadb>=1.5.9",
    "langchain-chroma>=1.1.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
llama-cloud = [
    "llama-cloud>=2.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
