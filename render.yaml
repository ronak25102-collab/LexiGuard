services:
  # 1. FastAPI Backend
  - type: web
    name: lexiguard-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Note: Free tier on Render doesn't support persistent disks. 
    # To retain ChromaDB and parsed sources, use a disk-capable plan and mount data.
    # disk:
    #   name: data
    #   mountPath: /app/data
    #   sizeGB: 1
    envVars:
      - key: LLM_PROVIDER
        value: codecraft
      - key: CODECRAFT_API_KEY
        sync: false
      - key: CODECRAFT_MODEL
        value: gpt-5.6-luna
      - key: EMBEDDING_PROVIDER
        value: google
      - key: GOOGLE_API_KEY
        sync: false # You will enter this in the Render Dashboard
      - key: NEO4J_URI
        sync: false # Enter your Neo4j AuraDB URI here
      - key: NEO4J_USERNAME
        sync: false # Use the username issued with your Aura credentials.
      - key: NEO4J_PASSWORD
        sync: false # Enter your Neo4j AuraDB Password here

  # 2. React Frontend
  - type: web
    name: lexiguard-ui
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: lexiguard-api
          envVarKey: RENDER_EXTERNAL_URL


